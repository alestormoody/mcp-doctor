version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - exhaustive
    - gocritic
    - gosec
    - misspell
    - noctx
    - nolintlint
    - revive
  # No blanket exclusions: any future exclusion must be path-scoped and carry a comment.

formatters:
  enable:
    - gofmt
    - goimports
